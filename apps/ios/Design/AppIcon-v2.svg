<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="canvas" cx="42%" cy="62%" r="76%">
      <stop offset="0" stop-color="#211E17"/>
      <stop offset="0.42" stop-color="#111316"/>
      <stop offset="1" stop-color="#090A0C"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- iOS applies the final corner mask; keep the source canvas square and opaque. -->
  <rect width="1024" height="1024" fill="url(#canvas)"/>

  <!--
    The established Lattices 3x3 mark. The bright cells retain the L silhouette;
    the amber center tile connects the app icon to the iOS companion's focus and
    attention color without changing the core logo.
  -->
  <g filter="url(#lift)">
    <!-- Row 1 -->
    <rect x="212" y="212" width="184" height="184" rx="36" fill="#E8E7E2"/>
    <rect x="420" y="212" width="184" height="184" rx="36" fill="#292B2F" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
    <rect x="628" y="212" width="184" height="184" rx="36" fill="#292B2F" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>

    <!-- Row 2 -->
    <rect x="212" y="420" width="184" height="184" rx="36" fill="#E8E7E2"/>
    <rect x="420" y="420" width="184" height="184" rx="36" fill="#E4B65C"/>
    <rect x="628" y="420" width="184" height="184" rx="36" fill="#292B2F" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>

    <!-- Row 3 -->
    <rect x="212" y="628" width="184" height="184" rx="36" fill="#E8E7E2"/>
    <rect x="420" y="628" width="184" height="184" rx="36" fill="#E8E7E2"/>
    <rect x="628" y="628" width="184" height="184" rx="36" fill="#E8E7E2"/>
  </g>
</svg>
