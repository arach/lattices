name: Release Blink npm

on:
  push:
    tags:
      - 'blink-npm-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm instead of running a dry run'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    name: Publish @arach/blink
    runs-on: macos-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use a trusted-publishing capable npm
        run: npm install --global npm@latest

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./products/blink/packages/npm/package.json').version")"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" != "blink-npm-v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=blink-v$version" >> "$GITHUB_OUTPUT"

      - name: Download and verify signed CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail

          mkdir -p products/blink/packages/npm/dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern blink-macos-arm64 \
            --output products/blink/packages/npm/dist/blink
          chmod +x products/blink/packages/npm/dist/blink
          test "$(products/blink/packages/npm/dist/blink --version)" = "$VERSION"
          codesign --verify --strict --verbose=2 products/blink/packages/npm/dist/blink

      - name: Package dry run
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        working-directory: products/blink/packages/npm
        run: npm publish --dry-run --ignore-scripts --access public

      - name: Publish with provenance
        if: ${{ github.event_name == 'push' || inputs.publish }}
        working-directory: products/blink/packages/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --ignore-scripts --provenance --access public
