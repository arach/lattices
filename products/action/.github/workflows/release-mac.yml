name: Release Mac DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.1.0'
        required: true
        type: string
      publish_release:
        description: 'Create/update the vX.Y.Z tag and public GitHub Release after the DMG verifies'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build, notarize, and publish
    runs-on: macos-26
    environment: release
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          if [ -d /Applications/Xcode_26.4.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.0.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi

          xcodebuild -version
          swift --version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish_release="true"
          else
            version="${{ inputs.version }}"
            publish_release="${{ inputs.publish_release }}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi

          if [[ "$publish_release" != "true" && "$publish_release" != "false" ]]; then
            echo "Invalid publish_release value: $publish_release" >&2
            exit 1
          fi

          build_number="${GITHUB_RUN_NUMBER:-1}"
          release_tag="v$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "publish_release=$publish_release" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "PUBLISH_RELEASE=$publish_release" >> "$GITHUB_ENV"

      - name: Check release tag
        if: ${{ steps.version.outputs.publish_release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags origin

          target_sha="$(git rev-parse HEAD)"
          existing_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1; exit}')"
          if [[ -z "$existing_sha" ]]; then
            existing_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1; exit}')"
          fi

          if [[ -n "$existing_sha" && "$existing_sha" != "$target_sha" ]]; then
            echo "Release tag $RELEASE_TAG already exists at $existing_sha, not $target_sha." >&2
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          keychain="$RUNNER_TEMP/action-release.keychain-db"
          cert_path="$RUNNER_TEMP/developer-id-application.p12"

          cert_password="$(printf '%s' "$CERT_PASSWORD" | tr -d '\r\n')"
          keychain_password="$(printf '%s' "$KEYCHAIN_PASSWORD" | tr -d '\r\n')"

          printf '%s' "$CERT_BASE64" | tr -d '[:space:]' | base64 -D > "$cert_path"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" \
            -k "$keychain" \
            -P "$cert_password" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application:/{print $2; exit}')"
          if [[ -z "$identity" ]]; then
            echo "Developer ID Application identity was not imported" >&2
            security find-identity -v -p codesigning "$keychain" >&2
            exit 1
          fi

          echo "ACTION_DEVELOPER_ID_APP=$identity" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain"

      - name: Configure App Store Connect notarization
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail

          key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"

          xcrun notarytool store-credentials notarytool \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --key "$key_path"

          echo "ACTION_NOTARY_PROFILE=notarytool" >> "$GITHUB_ENV"

      - name: Build signed and notarized DMG
        shell: bash
        run: bun run native:dmg:build -- --version "$VERSION" --build "$BUILD_NUMBER"

      - name: Verify DMG
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --verbose Installer/Action-for-Mac.dmg
          spctl --assess --type open --context context:primary-signature --verbose Installer/Action-for-Mac.dmg

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Action-${{ steps.version.outputs.version }}-dmg
          path: Installer/Action-for-Mac.dmg
          if-no-files-found: error

      - name: Create release tag
        if: ${{ github.event_name == 'workflow_dispatch' && steps.version.outputs.publish_release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          target_sha="$(git rev-parse HEAD)"
          existing_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1; exit}')"
          if [[ -z "$existing_sha" ]]; then
            existing_sha="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1; exit}')"
          fi

          if [[ -n "$existing_sha" ]]; then
            echo "Release tag already exists at $existing_sha"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Action $VERSION" "$target_sha"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub release
        if: ${{ steps.version.outputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          dmg_path="$RUNNER_TEMP/Action.dmg"
          versioned_dmg_path="$RUNNER_TEMP/Action-$VERSION.dmg"
          notes_path="$RUNNER_TEMP/release-notes.md"

          cp Installer/Action-for-Mac.dmg "$dmg_path"
          cp Installer/Action-for-Mac.dmg "$versioned_dmg_path"
          cat > "$notes_path" <<EOF
          Release $VERSION

          Download and install Action for Mac.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$dmg_path" "$versioned_dmg_path" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Action $VERSION" \
              --notes-file "$notes_path"
          else
            gh release create "$RELEASE_TAG" "$dmg_path" "$versioned_dmg_path" \
              --title "Action $VERSION" \
              --notes-file "$notes_path"
          fi
