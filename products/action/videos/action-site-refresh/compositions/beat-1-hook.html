    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      var root = document.querySelector('[data-composition-id="action-beat-1"]');
      var canvas = root.querySelector('.paper-canvas');
      var ctx = canvas.getContext('2d');
      var grainState = { time: 0, particleProgress: 0, particleOpacity: 0 };

      function hash(index, channel) {
        var n = index * 374761393 + channel * 668265263;
        n = (n ^ (n >> 13)) * 1274126177;
        return ((n ^ (n >> 16)) & 0x7fffffff) / 0x7fffffff;
      }

      function drawField() {
        ctx.clearRect(0, 0, 1920, 1080);

        for (var i = 0; i < 760; i += 1) {
          var gx = hash(i, 1) * 1920;
          var gy = hash(i, 2) * 1080;
          var pulse = 0.35 + 0.65 * hash(i, Math.floor(grainState.time * 7) + 3);
          ctx.fillStyle = 'rgba(32,40,43,' + (pulse * 0.035).toFixed(4) + ')';
          ctx.fillRect(gx, gy, 1.2, 1.2);
        }

        var eased = 1 - Math.pow(1 - grainState.particleProgress, 3);
        for (var p = 0; p < 18; p += 1) {
          var angle = hash(p, 8) * Math.PI * 2;
          var distance = (36 + hash(p, 9) * 138) * eased;
          var px = 1200 + Math.cos(angle) * distance;
          var py = 550 + Math.sin(angle) * distance;
          var size = 1.5 + hash(p, 10) * 3.5;
          ctx.fillStyle = 'rgba(32,40,43,' + (grainState.particleOpacity * (0.35 + hash(p, 11) * 0.5)).toFixed(4) + ')';
          ctx.beginPath();
          ctx.arc(px, py, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      drawField();

      var tl = gsap.timeline({ paused: true });

      tl.from('.hero-image', {
        opacity: 0.72,
        duration: 0.92,
        ease: 'sine.out'
      }, 0.12);

      tl.from('.action-mark', {
        x: -24,
        rotation: -4,
        opacity: 0,
        duration: 0.38,
        ease: 'expo.out'
      }, 0.16);

      tl.from('.field-kicker', {

        duration: 0.44,
        ease: 'power3.out'
      }, 0.2);

      tl.from('.field-rule', {

      tl.from('.frame-index-top', {

        ease: 'back.out(1.25)'
      }, 0.28);

        ease: 'circ.out'
      }, 0.3);

      var wordTimings = [0.12, 0.2, 0.54, 0.72, 0.86, 1.08];
      var wordSlides = [58, 48, 38, 28, 20, 12];
      root.querySelectorAll('.statement-word').forEach(function (word, index) {
        tl.from(word, {
          x: wordSlides[index],
          y: 24 - index * 2,
          opacity: 0,
          duration: 0.34 + index * 0.035,
          ease: index % 3 === 0 ? 'power4.out' : (index % 3 === 1 ? 'expo.out' : 'circ.out')
        }, wordTimings[index]);
      });

      tl.from('.ring-outer', {
        strokeDashoffset: 1106,
        opacity: 0,
        duration: 0.86,
        ease: 'power2.out'
      }, 0.3);

      tl.from('.ring-middle', {
        strokeDashoffset: -830,
        opacity: 0,
        duration: 0.72,
        ease: 'sine.inOut'
      }, 0.42);

      tl.from('.ring-inner', {
        strokeDashoffset: 553,
        opacity: 0,
        duration: 0.6,
        ease: 'expo.out'
      }, 0.54);

      tl.from('.crosshair-horizontal', {
        strokeDashoffset: 484,
        opacity: 0,
        duration: 0.64,
        ease: 'power3.out'
      }, 0.62);

      tl.from('.crosshair-vertical', {
        strokeDashoffset: -484,
        opacity: 0,
        duration: 0.7,
        ease: 'circ.out'
      }, 0.68);

      tl.from('.lens-core', {
        scale: 0.4,
        opacity: 0,
        transformOrigin: '1200px 550px',
        duration: 0.46,
        ease: 'back.out(1.5)'
      }, 0.82);

      var tickOrigins = [
        { x: 0, y: -38, rotation: -9 },
        { x: 28, y: -24, rotation: 7 },
        { x: 40, y: 0, rotation: 11 },
        { x: 28, y: 24, rotation: -8 },
        { x: 0, y: 38, rotation: 10 },
        { x: -28, y: 24, rotation: -7 },
        { x: -40, y: 0, rotation: 9 },
        { x: -28, y: -24, rotation: -11 }
      ];

      root.querySelectorAll('.calibration-tick').forEach(function (tick, index) {
        tl.from(tick, {
          x: tickOrigins[index].x,
          y: tickOrigins[index].y,
          rotation: tickOrigins[index].rotation,
          opacity: 0,
          transformOrigin: '1200px 550px',
          duration: 0.3 + index * 0.02,
          ease: index % 2 === 0 ? 'back.out(1.2)' : 'power4.out'
        }, 1.06 + index * 0.035);
      });

      tl.from('.proof-stamp', {
        x: -22,
        y: 10,
        scale: 0.91,
        rotation: -1.4,
        opacity: 0,
        duration: 0.22,
        ease: 'power4.out'
      }, 1.62);

      tl.to('.proof-stamp', {
        scale: 1.035,
        duration: 0.067,
        ease: 'power1.out'
      }, 1.84);

      tl.to('.proof-stamp', {
        scale: 1,
        duration: 0.067,
        ease: 'power2.inOut'
      }, 1.907);

      tl.from('.record-status', {
        x: -26,
        opacity: 0,
        duration: 0.36,
        ease: 'expo.out'
      }, 1.88);

      tl.from('.record-node', {
        scale: 0,
        duration: 0.28,
        ease: 'back.out(1.8)'
      }, 1.98);

      tl.to('.record-node', {
        scale: 1.55,
        duration: 0.14,
        yoyo: true,
        repeat: 1,
        ease: 'power2.inOut'
      }, 2.29);

      tl.to(grainState, {
        particleProgress: 1,
        particleOpacity: 0.82,
        duration: 0.32,
        ease: 'power3.out',
        onUpdate: drawField
      }, 2.28);

      tl.to(grainState, {
        particleOpacity: 0,
        duration: 0.34,
        ease: 'power2.in',
        onUpdate: drawField
      }, 2.62);

      tl.to(grainState, {
        time: 3.39,
        duration: 3.39,
        ease: 'none',
        onUpdate: drawField
      }, 0);

      tl.to('.hero-image', {
        x: -58,
        y: 18,
        scale: 1.03,
        duration: 3.39,
        ease: 'none'
      }, 0);

      tl.to('.world', {
        scale: 6.6,
        filter: 'blur(7px)',
        duration: 0.55,
        ease: 'power2.inOut'
      }, 2.84);

      tl.fromTo('.zoom-portal', {
        opacity: 0,
        scale: 0.05
      }, {
        opacity: 1,
        scale: 34,
        duration: 0.55,
        ease: 'power2.inOut'
      }, 2.84);

      window.__timelines['action-beat-1'] = tl;
