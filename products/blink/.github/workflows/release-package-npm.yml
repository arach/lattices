name: Release Package npm

on:
  push:
    tags:
      - "npm-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm instead of running a dry run
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: macos-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use a trusted-publishing capable npm
        run: npm install --global npm@latest

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/npm/package.json').version")"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" != "npm-v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download and verify signed CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p packages/npm/dist
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern blink-macos-arm64 --output packages/npm/dist/blink
          chmod +x packages/npm/dist/blink
          test "$(packages/npm/dist/blink --version)" = "$VERSION"
          codesign --verify --strict --verbose=2 packages/npm/dist/blink

      - name: Package dry run
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        working-directory: packages/npm
        run: npm publish --dry-run --ignore-scripts --access public

      - name: Publish with provenance
        if: ${{ github.event_name == 'push' || inputs.publish }}
        working-directory: packages/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --ignore-scripts --provenance --access public
