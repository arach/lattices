name: Blink Guards

on:
  push:
    branches:
      - main
    paths:
      - 'products/blink/**'
      - 'package.json'
      - '.github/workflows/blink-guards.yml'
  pull_request:
    paths:
      - 'products/blink/**'
      - 'package.json'
      - '.github/workflows/blink-guards.yml'
  workflow_dispatch:

jobs:
  swift:
    name: Blink Swift package
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HUDSON_READ_TOKEN: ${{ secrets.HUDSON_READ_TOKEN }}
      BLINK_HUDSON_SOURCE: git
      BLINK_HUDSON_REVISION: 79ca548b2b30335a3c37fb031a753481dedaaf79

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure private Hudson access
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HUDSON_READ_TOKEN:-}" ]]; then
            echo "::error::HUDSON_READ_TOKEN secret is not set. Add a read-only PAT for arach/hudson." >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${HUDSON_READ_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          # Vox requires Swift tools 6.2; the macOS 15 runner defaults to
          # Xcode 16.4 (Swift 6.1). Pick the newest Xcode 26 present.
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$xcode" ]]; then
            echo "No Xcode 26 found on this runner:" >&2
            ls -d /Applications/Xcode_*.app >&2
            exit 1
          fi

          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Check Blink
        run: bun run blink:check

      - name: Build Blink
        run: bun run blink:build
